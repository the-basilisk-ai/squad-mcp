[build]
builder = "RAILPACK"

# Railpack runs the `build` script on its own. startCommand stays: without a
# custom start command Railpack falls back to serving build output with Caddy
# instead of running the server.
[deploy]
startCommand = "pnpm start"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
# Spent retries leave the service down until a manual redeploy; 3 was low
# enough that one transient crash latched it off.
restartPolicyMaxRetries = 10
